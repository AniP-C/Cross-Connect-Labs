server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text files before sending them.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Do not reveal the nginx version in headers or error pages.
    server_tokens off;

    # Astro puts CSS, JS and fonts in /_astro/ with a content hash in the name,
    # so they can be cached for a year: a change produces a new file name.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Pages: always check for a newer version.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ $uri.html =404;
    }

    # The visit log dashboard (docs/analytics.md): never cached, never indexed. There is no
    # Worker in the Docker image, so it only shows the key box here.
    location /admin {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
